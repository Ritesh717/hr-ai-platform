[project]
name = "hr-ai-platform"
version = "0.1.0"
description = "Production-grade HR AI Agent Platform — a learning path for building AI agents inside a real application"
authors = [{ name = "Ritesh Reddy", email = "riteshreddy717@gmail.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "asyncpg>=0.30.0,<0.32.0",
  "alembic>=1.13.0,<2.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "redis>=5.0.0,<6.0.0",
  "opentelemetry-sdk>=1.26.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0,<0.48",
]

[project.scripts]
start = "apps.api.cli:main"

[tool.poetry]
packages = [
  { include = "apps" },
  { include = "domain" },
  { include = "infrastructure" },
  { include = "shared" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
