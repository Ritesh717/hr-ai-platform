name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-node:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        # mongodb-memory-server downloads and runs its own mongod (replica-set mode) per test
        # file — no external `mongo` service container needed in CI.
        env:
          MONGOMS_VERSION: "7.0.14"
        run: npm run test:e2e

  test-web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test-web-e2e:
    # Full-stack Playwright suite (docs/e2e-test-plan.md, apps/web/e2e/): drives the real
    # frontend against a real backend + Mongo replica set, unlike test-node's E2E tests (which
    # only exercise the API layer via mongodb-memory-server). Gated behind test-web (frontend
    # must at least lint/build) but deliberately NOT behind test-node's Jest suite — the two are
    # independent test surfaces, and test-node has pre-existing failures unrelated to this suite
    # (see PR #182) that shouldn't block this job from proving itself out.
    runs-on: ubuntu-latest
    needs: [test-web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]})"

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Start API
        working-directory: apps/api
        env:
          PORT: 3001
          MONGODB_URI: mongodb://127.0.0.1:27017/hr_ai_platform?replicaSet=rs0
          JWT_SECRET: ci-e2e-secret
          JWT_ALGORITHM: HS256
          JWT_EXPIRES_MINUTES: 480
          CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
          AGENT_MODEL_PROVIDER: anthropic
          AGENT_MODEL_NAME: claude-3-5-haiku-20241022
          AGENT_PROMPT_VERSION: v2
        run: |
          nohup npm run start:prod > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3001/health || (cat api.log; exit 1)

      - name: Seed demo tenant
        working-directory: apps/api
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/hr_ai_platform?replicaSet=rs0
        run: npm run seed-demo-org -- --tenant-name "Test Org" --tenant-slug globex

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Start web
        working-directory: apps/web
        run: |
          nohup npm run start > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000 >/dev/null || (cat web.log; exit 1)

      - name: Run Playwright e2e suite
        working-directory: apps/web
        run: npm run test:e2e -- --workers=2

      - name: Upload Playwright report
        # Self-contained HTML report (open with `npx playwright show-report`) — embeds every
        # test's trace/video/screenshot for click-through review, pass or fail.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload raw test recordings
        # Same videos/traces as above but as plain files (video.webm / trace.zip per test) for
        # anyone who wants to grab a single recording without spinning up the HTML report server.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-recordings
          path: apps/web/test-results/
          retention-days: 14
